name: Containers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Match the workspace owner
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build development image
        run: docker compose build rails
      - name: Test against MySQL
        run: >-
          docker compose run --rm rails sh -c
          'RAILS_ENV=test bin/rails db:prepare && bin/rails test && bin/rails zeitwerk:check'
      - name: Build production image and assets
        run: docker build --target production --tag seminars:ci .
      - name: Check production boot
        run: docker run --rm -e SECRET_KEY_BASE_DUMMY=1 seminars:ci bin/rails zeitwerk:check
      - name: Stop services
        if: always()
        run: docker compose down --volumes
