name: programs-production

services:
  rails:
    build:
      context: ../..
      target: production
    init: true
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set a persistent production SECRET_KEY_BASE}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_PASSWORD: ${LDAP_PASSWORD:-}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - storage:/app/storage

volumes:
  storage:
